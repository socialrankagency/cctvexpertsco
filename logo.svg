<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 75" width="300" height="75">
  <defs>
    <linearGradient id="lgRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e6c"/>
      <stop offset="50%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#c1121f"/>
    </linearGradient>
    <linearGradient id="lgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a4a7a"/>
      <stop offset="100%" stop-color="#0b1d3a"/>
    </linearGradient>
    <linearGradient id="lgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dx="0" dy="1.5" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon Background Circle with gold ring -->
  <circle cx="37" cy="37" r="33" fill="url(#lgRed)" filter="url(#softShadow)"/>
  <circle cx="37" cy="37" r="33" fill="none" stroke="url(#lgGold)" stroke-width="2"/>
  <circle cx="37" cy="37" r="29" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.35"/>

  <!-- Motion / speed lines -->
  <line x1="2" y1="22" x2="14" y2="22" stroke="url(#lgGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="-2" y1="32" x2="12" y2="32" stroke="url(#lgGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="2" y1="42" x2="14" y2="42" stroke="url(#lgGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="6" y1="52" x2="14" y2="52" stroke="url(#lgGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Truck shadow -->
  <ellipse cx="38" cy="52" rx="20" ry="2" fill="rgba(0,0,0,0.18)"/>

  <!-- Truck Body (cargo) -->
  <rect x="18" y="26" width="22" height="18" rx="2.5" fill="#fff"/>
  <rect x="18" y="26" width="22" height="4" fill="#f1faee"/>
  <!-- Cargo lines -->
  <line x1="22" y1="34" x2="36" y2="34" stroke="#cdd5e0" stroke-width="0.8"/>
  <line x1="22" y1="38" x2="36" y2="38" stroke="#cdd5e0" stroke-width="0.8"/>

  <!-- Truck Cab -->
  <path d="M40 28 L50 28 L55 35 L55 44 L40 44 Z" fill="#fff"/>
  <!-- Window -->
  <path d="M42 30 L48.5 30 L52 35 L42 35 Z" fill="url(#lgNavy)"/>
  <!-- Window highlight -->
  <path d="M43 31 L46 31 L44.5 33 Z" fill="#fff" opacity="0.4"/>

  <!-- Wheels -->
  <circle cx="26" cy="46" r="4.5" fill="#1d3557"/>
  <circle cx="26" cy="46" r="2" fill="#fff"/>
  <circle cx="26" cy="46" r="0.8" fill="#1d3557"/>
  <circle cx="48" cy="46" r="4.5" fill="#1d3557"/>
  <circle cx="48" cy="46" r="2" fill="#fff"/>
  <circle cx="48" cy="46" r="0.8" fill="#1d3557"/>

  <!-- Forward arrow on truck (movement) -->
  <path d="M22 33 L29 33 L29 31 L33 35 L29 39 L29 37 L22 37 Z" fill="url(#lgRed)"/>

  <!-- Small star/spark above -->
  <path d="M58 18 L59 20.5 L61.5 21 L59 21.5 L58 24 L57 21.5 L54.5 21 L57 20.5 Z" fill="url(#lgGold)"/>

  <!-- Text: QUICK -->
  <text x="82" y="36" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="900" fill="url(#lgNavy)" letter-spacing="-0.5">QUICK</text>
  <!-- Text: MOVERS -->
  <text x="82" y="56" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="800" fill="url(#lgRed)" letter-spacing="3.5">MOVERS</text>
  <!-- Dot separator -->
  <circle cx="186" cy="51" r="2" fill="url(#lgGold)"/>
  <!-- Bahrain badge -->
  <text x="194" y="55" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="600" fill="#6c757d" letter-spacing="2">BAHRAIN</text>
  <!-- Stars under "Bahrain" indicating quality -->
  <g fill="url(#lgGold)">
    <text x="194" y="65" font-family="Arial, sans-serif" font-size="7" letter-spacing="2">★★★★★</text>
  </g>
</svg>
